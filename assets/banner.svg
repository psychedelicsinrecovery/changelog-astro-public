    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="58.8" fill="#9373ce" font-size="15" font-weight="700" letter-spacing=".6">PIR® · Psychedelics In Recovery™</text><text x="56" y="120.6" fill="#ede9fe" font-size="56" font-weight="700" letter-spacing="-.5">Changelog &amp; Library</text><text x="56" y="163.8" fill="#d0cbe3" font-size="23">What actually shipped for the fellowship, in plain</text><text x="56" y="194.6" fill="#d0cbe3" font-size="23">language.</text></g>
